text.mattermost_instructions = "این یکپارچه‌سازی اعلان‌های به‌روزرسانی را به کانال انتخابی شما ارسال می‌کند.<br/>دستورالعمل‌های <a href='https://docs.mattermost.com/developer/webhooks-incoming.html#simple-incoming-webhook' target='_blank'>اینجا را برای دریافت نشانی وب‌هوک ورودی</a> از Mattermost دنبال کنید. سپس پیوند را در فرم سمت راست بچسبانید و ذخیره را کلیک کنید."
text.slack_instructions = "این یکپارچه‌سازی اعلان‌های به‌روزرسانی را به کانال انتخابی شما ارسال می‌کند.<br/>دستورالعمل‌های <a href='https://get.slack.help/hc/en-us/articles/115005265063-Incoming-WebHooks-for-Slack' target='_blank'>اینجا را برای دریافت نشانی وب‌هوک ورودی</a> از Slack دنبال کنید. سپس پیوند را در فرم سمت راست بچسبانید و ذخیره را کلیک کنید."
text.choose_access_for_users = "کاربرانی که می‌خواهید اضافه/حذف کنید را علامت بزنید یا علامت را بردارید. می‌توانید درباره نقش‌ها در <a href='https://docs.leantime.io/#/using-leantime/user-management?id=roles' target='_blank'>https://docs.leantime.io</a> بیشتر بدانید"
text.expected_to_finish_by = "انتظار می‌رود تا این زمان تمام شود"
text.zulip_instructions = "این یکپارچه‌سازی اعلان‌های به‌روزرسانی را به جریان و موضوع انتخابی شما ارسال می‌کند.<br/>دستورالعمل‌های <a href='https://zulipchat.com/help/add-a-bot-or-integration' target='_blank'>اینجا را برای ایجاد یک ربات جدید</a> دنبال کنید. سپس اطلاعات را در فرم سمت راست بچسبانید و ذخیره را کلیک کنید."
text.telegram_instructions = "این یکپارچه‌سازی اعلان‌های به‌روزرسانی را به یک گفتگوی Telegram ارسال می‌کند.<br/>یک ربات با <a href='https://core.telegram.org/bots#how-do-i-create-a-bot' target='_blank'>@BotFather</a> ایجاد کنید و توکن را در سمت راست بچسبانید. یک بار به ربات خود پیام بفرستید و برای تشخیص خودکار گفتگو روی ذخیره کلیک کنید — یا برای گروهی که Topics فعال دارد، شناسه گفتگو و شناسه موضوع گروه را مستقیماً وارد کنید."
text.discord_instructions = "این یکپارچه‌سازی اعلان‌های به‌روزرسانی را به کانال انتخابی شما ارسال می‌کند.<br/>دستورالعمل‌های <a href='https://support.discord.com/hc/en-us/articles/228383668-Intro-to-Webhooks' target='_blank'>اینجا را برای ایجاد وب‌هوک(های) جدید</a> دنبال کنید، سپس پیوند(ها) را در فیلدهای سمت راست بچسبانید و ذخیره را کلیک کنید."
