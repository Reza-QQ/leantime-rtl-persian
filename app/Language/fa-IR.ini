text.these_are_system_wide_settings = "این‌ها تنظیمات سراسری سیستم هستند که بر ظاهر و احساس تجربه Leantime شما تأثیر می‌گذارند."
text.company_name_helper = "در عنوان صفحه و ایمیل‌ها نمایش داده می‌شود"
text.advanced_boards_helper_content = "ایده‌ها تکامل می‌یابند، رشد می‌کنند و بالغ می‌شوند. اینجا جایی است که آن‌ها را پیگیری می‌کنید.<br/>کارت‌های ایده را از یک ستون به ستون بعدی منتقل کنید تا وضعیت فعلی آن‌ها را نشان دهید.<br/>این مکان خوبی برای شروع تحقیق، توسعه نمونه‌های اولیه و اعتبارسنجی آن‌ها با چند مشتری قبل از شروع پیاده‌سازی است."
text.backlog_helper_content = "بک‌لاگ خانه همه کارهای شماست؛ کارهایی که اکنون روی آن‌ها کار می‌کنید و کارهایی که قصد دارید روی آن‌ها کار کنید.<br/><br/>برای پیشرفت در تکمیل بک‌لاگ توصیه می‌کنیم در تکرارهای کوتاه — اسپرینت‌ها — کار کنید.<br/>اسپرینت‌ها بازه‌های دو هفته‌ای هستند که به شما امکان می‌دهند روی بخش‌های کوچک‌تر و قابل تحویل کار تمرکز کنید.<br/>در پایان دو هفته باید چیزی برای «نمایش» داشته باشید. چیزی که برای کاربران یا مشتریان شما ارزش ایجاد کند.<br/><br/>در این صفحه می‌توانید فهرست کارهای خود را سازمان‌دهی و مدیریت کنید، بک‌لاگ را با کشیدن و رها کردن اولویت‌بندی کنید و موارد بک‌لاگ را به اسپرینت فعلی خود منتقل کنید.<br/>اطلاعات بیشتر می‌خواهید؟ تور را شروع کنید یا ببندید تا شروع کنید!"
text.glad_youre_here = "خوشحالیم که اینجا هستید. بیایید یک دقیقه وقت بگذاریم تا با هم آشنا شویم."
text.business_research_section = "بخش تحقیق کسب‌وکار خانه جدید ایده‌های شماست. این بخش برای طی کردن مراحل توسعه مشتری، تحقیق مشکل و ایده‌پردازی راه‌حل طراحی شده است."
text.our_roadmap_design = "نقشه راه ما برای بردن شما از نقاط عطف کوچک‌تر و قابل مدیریت به تکمیل تصویر بزرگ طراحی شده است. نقاط عطف را حدود ۳ ماهه برنامه‌ریزی کنید و از این نشانگرهای پروژه برای ماندن در مسیر استفاده کنید."
text.this_is_where_you_spend_most_time = "اینجا جایی است که بیشترین زمان خود را می‌گذرانید — انجام کار. اسپرینت‌های دو هفته‌ای خود را برنامه‌ریزی کنید و با تخته کانبان و ابزارهای بک‌لاگ ما با موفقیت اجرا کنید. از بازنگری‌ها برای رشد در اسپرینت بعدی استفاده کنید."
text.idea_board_helper_content = "اینجا جایی است که همه ایده‌های خود را جمع می‌کنید. ایده‌های جدید را با تیم خود گفتگو کنید و نقاط عطف را برای دیدن پیشرفت به سمت ایده‌هایتان پیوست کنید."
text.kanban_helper_content = "کانبان واژه ژاپنی «کارت» است. تخته‌های کانبان را مهندسان تویوتا در دهه ۴۰ با تولید ناب آغاز کردند.<br/>از آن برای به اشتراک گذاری بصری اطلاعات و پیشرفت کار به سرعت استفاده می‌شود.<br/>تخته‌های کانبان برای تجسم کار و وضعیت، کمک به مدیریت کار فعال یا در حال انجام، مدیریت جریان کار و اقدام سریع به سمت بهبودهای ناب مفید هستند."
text.my_timesheets_helper_content = "برگه‌های زمان جایی برای پیگیری ساعات واقعی کار روی یک کار هستند.<br/>این برای اهداف صورت‌حساب مفید است و همچنین برای اعتبارسنجی اینکه چقدر خوب وظایف خود را از قبل برنامه‌ریزی می‌کنید.<br/>با گذشت زمان Leantime می‌تواند تاریخ‌های سررسید را برای جبران اختلافات برنامه‌ریزی تنظیم کند."
text.new_project_helper_content = "<p>اینجا جایی است که پروژه خود را توصیف، تعریف و پارامترهای آن را تنظیم می‌کنید. این مهم است زیرا بخشی است که به<br/>کل تیم اولویت‌ها، انتظارات و دستورالعمل‌های پروژه را منتقل می‌کند.</p><p><br/><em>مواردی که اینجا باید به آن فکر کنید: ۴C.<br/>شفاف، مختصر، کامل و معتبر باشید.<br/><br/></em></p><p>تسلط بر این موارد در توضیحات پروژه شما همه را در یک صفحه نگه می‌دارد و به کاهش خطر خطا یا اشتباه کمک می‌کند.</p><br/>وقت شروع است!<br/><br/>"
text.not_found_helper_content = "<p>ما هنوز محتوایی برای این صفحه نداریم.<br/>لطفاً برای یادگیری بیشتر درباره کارهایی که می‌توانید اینجا انجام دهید از پیوند «نیاز به کمک» در پایین استفاده کنید.</p>"
text.retros_helper_content = "<p>بازنگری‌ها تأملات سریعی درباره کار، عملکرد تیم و البته پیشرفت هستند.<br/>اینجا جایی است که تیم شما می‌تواند لحظه‌ای وقت بگذارد تا روی آنچه خوب پیش رفت، آنچه خوب پیش نرفت و آنچه می‌توان دفعه بعد متفاوت انجام داد تمرکز کند.<br/>توصیه می‌کنیم یک جلسه بازبینی در فواصل منظم، یا حداقل در پایان هر نقطه عطف برگزار کنید.<br/></p>"
text.roadmap_helper_content = "<p>نقشه‌های راه برای تقسیم پروژه‌های بزرگ به بخش‌های کوچک‌تر و قابل مدیریت‌تر مفید هستند.<br/><br/></p><p>برای ایجاد نقشه راه، توصیه می‌کنیم نقاط عطفی تعیین کنید که در بازه ۳ ماهه قابل دستیابی باشند.</p><p>نقاط عطف ایست‌های بازرسی در مسیر تکمیل پروژه هستند.<br/>به زبان ساده: اگر در یک سفر جاده‌ای سراسر کشور هستید، هر ایالتی که از آن عبور می‌کنید می‌تواند یک نقطه عطف باشد.<br/><br/>برای شروع، روی «افزودن نقطه عطف» در سمت چپ بالا کلیک کنید. تاریخ را در این تب یا در خود نمودار نقشه راه با کلیک و کشیدن نقطه عطف در تقویم تنظیم کنید.</p>"
text.show_clients_helper_content = "<p>مشتریان/محصولات پروژه‌های شما را در دسته‌بندی‌ها سازمان‌دهی می‌کنند و به شما امکان می‌دهند گروه‌های مختلف را جدا کنید.<br/><br/></p><p>به عنوان مشاور، شما از قبل با مشتریان کار می‌کنید و اینجا جای سازمان‌دهی آن‌هاست.</p><p>اگر یک تیم محصول هستید، می‌توانید از این بخش برای سازمان‌دهی و جدا کردن دپارتمان‌های خود (بازاریابی، فروش، عملیات و غیره) استفاده کنید.</p>"
text.show_projects_helper_content = "<p>پروژه‌ها قلب کسب‌وکار شما و Leantime هستند! تغییر، توسعه، اهداف و هر چیزی که می‌توانید بسازید یا در رویای آن باشید شامل پروژه‌ها می‌شود.<br/>مدیریت پروژه به سادگی فرآیند اطمینان از این است که پروژه‌های شما به‌موقع، درست و با ارزش واقعی کسب‌وکار تحویل داده شوند.<br/><br/>اینجا جایی است که پروژه‌های شما زندگی می‌کنند. صفحه پروژه‌های شما به شما امکان می‌دهد پروژه ایجاد کنید، به سرعت تعداد کارها، ساعات، بودجه و مشتری مرتبط با پروژه را ببینید.<br/><br/>از این صفحه برای نمای کلی سریع همه پروژه‌های خود استفاده کنید.<br/><br/></p>"
text.new_db_version = "نسخه جدیدی نصب شده است. برای استفاده از Leantime باید پایگاه داده خود را به‌روزرسانی کنید.<br/><br/><strong>لطفاً قبل از انجام این به‌روزرسانی حتماً از پایگاه داده خود نسخه پشتیبان بگیرید!</strong><br/>این ممکن است چند دقیقه طول بکشد."
text.update_was_successful = "به‌روزرسانی موفق بود، اکنون می‌توانید وارد شوید. <a href='%1$s'>رفتن به ورود</a>"
text.this_script_will_set_up_leantime = "این اسکریپت پایگاه داده شما را راه‌اندازی می‌کند و یک حساب مدیر ایجاد می‌کند"
