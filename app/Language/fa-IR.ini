text.full_lean_canvas_helper_content = "تخته تحقیق کامل شما را در کل فرآیند اعتبارسنجی ایده راهنمایی می‌کند.<br/>در این صفحه، یک بار دیگر به بخش مشتری، مشکل، راه‌حل می‌پردازید (اما نگران نباشید، اگر قبلاً این را در تخته ساده پر کرده‌اید، دوباره اینجا خواهید دید!).<br/>از آنجا، به ارزش پیشنهادی واضح (چه چیزی ایده شما را بهتر از سایر پیشنهادها می‌کند؟)،<br/>کانال‌های فروش (مشتریان چگونه راه‌حل شما را دریافت می‌کنند؟)<br/>جریان‌های درآمد (راه‌حل شما چگونه پول درمی‌آورد؟)<br/>ساختار هزینه (راه‌حل شما چقدر ارزش دارد؟) معیارهای کلیدی (موفقیت را چگونه اندازه‌گیری می‌کنید؟)<br/>و مزیت ناعادلانه (چه چیزی به شما کمک می‌کند در برابر رقابت متمایز شوید؟)<br/>پاسخ به این پرسش‌ها برای هدایت موفقیت، کاهش شکست و امکان پیگیری و اعتبارسنجی فرض‌های شما طراحی شده است.<br/>Lean به معنای حذف اتلاف و تلاش برای ساختن محصولات، فروشگاه‌ها و راه‌حل‌هایی است که مشتریان شما به آن نیاز دارند."
